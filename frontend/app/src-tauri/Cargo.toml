[package]
name = "lilith-pet"
version = "0.2.0"
description = "AI 桌面宠物（Live2D）"
authors = ["Lilith AI Desktop Pet contributors"]
edition = "2021"

[lib]
# Windows 下 lib / bin 同名会冲突，所以加 _lib 后缀
name = "lilith_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 0
overflow-checks = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
